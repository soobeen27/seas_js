<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <style>
      #map {
        height: 480px;
      }
    </style>
  </head>
  <body>
    <div>
      <label for="start">출발지(lat, lng):</label>
      <input type="text" id="start" value="37.5284, 126.9332" />
      <br />
      <label for="start">도착지(lat, lang):</label>
      <input type="text" id="end" value="37.5866, 126.9748" />
      <br />
      <button onclick="findRoute()">경로찾기</button>
    </div>

    <div id="map"></div>
    <script>
      let map = L.map('map').setView([37.5665, 126.978], 12);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

      function findRoute() {
        let startInput = document.getElementById('start').value;
        let endInput = document.getElementById('end').value;
        let startCoord = startInput.split(',').map((coord) => parseFloat(coord.trim()));
        let endCoord = endInput.split(',').map((coord) => parseFloat(coord.trim()));

        let control = L.Routing.control({
          waypoints: [L.latLng(startCoord), L.latLng(endCoord)],
        }).addTo(map);

        // let route = L.polyline([startCoord, endCoord], { color: 'blue' }).addTo(map);
        // map.fitBounds(route.getBounds());
      }
    </script>
  </body>
</html>
