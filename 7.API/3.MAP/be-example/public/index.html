<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      #map {
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let map = L.map('map').setView([37.5665, 126.978], 12);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

      let seoulData = {};

      function calculateMarkerRadius(population) {
        let minRadius = 20;
        let maxRadius = 80;

        let minPop = 100_000;
        let maxPop = 1_000_000;
        let radius = minRadius + ((population - minPop) / (maxPop - minPop)) * (maxRadius - minRadius);
        return radius;
      }

      fetch('/api/seoul')
        .then((res) => res.json())
        .then((data) => {
          for (let i = 0; i < data.length; i++) {
            let pop = parseInt(data[i].population);
            let radius = calculateMarkerRadius(data[i].population);

            let marker = L.circleMarker([data[i].lat, data[i].lng], {
              radius: radius,
              fillColor: 'red',
              color: 'red',
              fillOpacity: 0.5,
              weight: 1,
            }).addTo(map);

            marker.bindTooltip(data[i].district, {
              permanent: true,
              direction: 'center',
              className: 'maker-label',
            });
            marker.bindPopup(`<b>${data[i].district}</b><br>인구: ${data[i].population}`);
          }
        });
    </script>
  </body>
</html>
