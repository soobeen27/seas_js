<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>데이트 코스 메이커</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }
      #sidebar {
        width: 350px;
        padding: 20px;
        background: #fff5f7;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        overflow-y: auto;
      }
      #map {
        flex: 1;
      }
      .input-group {
        margin-bottom: 10px;
        display: flex;
        gap: 5px;
      }
      input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ffb6c1;
        border-radius: 5px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 5px;
        padding: 8px 12px;
        transition: 0.3s;
      }
      .btn-add {
        background: #ff69b4;
        color: white;
        width: 100%;
        margin-bottom: 10px;
        font-weight: bold;
      }
      .btn-route {
        background: #4a90e2;
        color: white;
        width: 100%;
        font-weight: bold;
        height: 40px;
      }
      .btn-remove {
        background: #ff4d4d;
        color: white;
      }
      h2 {
        color: #ff69b4;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>💖 Date Planner</h2>
      <div id="destinations">
        <div class="input-group">
          <input type="text" class="addr-input" placeholder="출발지 (예: 강남역)" value="서울역" />
        </div>
      </div>
      <button class="btn-add" onclick="addInput()">+ 장소 추가</button>
      <button class="btn-route" onclick="drawDateRoute()">코스 그리기 & 경로 찾기</button>
      <p style="font-size: 12px; color: #888; margin-top: 15px">* 상세 주소(구, 동)를 입력하면 더 정확해요!</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      let map = L.map('map').setView([37.5665, 126.978], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      let markers = [];
      let polyline = null;

      // 1. 장소 입력칸 추가 함수
      function addInput() {
        const container = document.getElementById('destinations');
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
          <input type="text" class="addr-input" placeholder="다음 장소 (예: 맛집, 카페)">
          <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
      }

      // 2. 주소를 좌표로 변환 (Nominatim API - 별도 키 불필요)
      async function getCoords(address) {
        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`,
          );
          const data = await response.json();
          if (data && data.length > 0) {
            return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          }
          return null;
        } catch (error) {
          console.error('지오코딩 에러:', error);
          return null;
        }
      }

      // 3. 메인 로직: 경로 그리기
      async function drawDateRoute() {
        const inputs = document.querySelectorAll('.addr-input');
        const coords = [];

        // 기존 마커 및 선 제거
        markers.forEach((m) => map.removeLayer(m));
        markers = [];
        if (polyline) map.removeLayer(polyline);

        for (let input of inputs) {
          const addr = input.value.trim();
          if (addr) {
            const pos = await getCoords(addr);
            if (pos) {
              coords.push(pos);
              const marker = L.marker(pos).addTo(map).bindPopup(addr);
              markers.push(marker);
            } else {
              alert(`'${addr}' 위치를 찾을 수 없습니다.`);
            }
          }
        }

        if (coords.length > 1) {
          // 선 그리기
          polyline = L.polyline(coords, { color: '#ff69b4', weight: 5, opacity: 0.7, dashArray: '10, 10' }).addTo(map);
          // 모든 마커가 보이도록 화면 맞춤
          map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        } else if (coords.length === 1) {
          map.setView(coords[0], 15);
        }
      }
    </script>
  </body>
</html>
